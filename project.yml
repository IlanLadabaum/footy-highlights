name: FootyHighlights
options:
  bundleIdPrefix: io.github.ilanladabaum
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FootyKit:
    path: FootyKit
targets:
  FootyHighlights:
    type: application
    supportedDestinations: [macOS]
    sources:
      - FootyHighlights
    dependencies:
      - package: FootyKit
        product: FootyKit
    info:
      path: FootyHighlights/Info.plist
      properties:
        CFBundleDisplayName: Footy Highlights
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        # Debug builds read .env from the project folder (developer convenience).
        FHProjectDir: $(FH_PROJECT_DIR)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ilanladabaum.footyhighlights
        PRODUCT_NAME: Footy Highlights
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FH_PROJECT_DIR: ""
      configs:
        Debug:
          FH_PROJECT_DIR: $(SRCROOT)
    scheme:
      testTargets:
        - FootyHighlightsTests
  FootyHighlightsTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - FootyHighlightsTests
    dependencies:
      - target: FootyHighlights
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Footy Highlights.app/Contents/MacOS/Footy Highlights
        BUNDLE_LOADER: $(TEST_HOST)
