name: FootyHighlights
options:
  bundleIdPrefix: io.github.ilanladabaum
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FootyKit:
    path: FootyKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  FootyHighlights:
    type: application
    supportedDestinations: [macOS]
    sources:
      - FootyHighlights
    dependencies:
      - package: FootyKit
        product: FootyKit
      - package: Sparkle
        product: Sparkle
    info:
      path: FootyHighlights/Info.plist
      properties:
        CFBundleDisplayName: Footy Highlights
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        # Sparkle updates: feed attached to the latest GitHub Release, daily check, ask before installing.
        SUFeedURL: https://github.com/IlanLadabaum/footy-highlights/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        # Debug builds read .env from the project folder (developer convenience).
        FHProjectDir: $(FH_PROJECT_DIR)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ilanladabaum.footyhighlights
        PRODUCT_NAME: Footy Highlights
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FH_PROJECT_DIR: ""
        # Public half of the Sparkle EdDSA key (`generate_keys -p`). The private key never goes in the repo.
        SPARKLE_PUBLIC_ED_KEY: "rze94nLOqJ0IAZYcyWTme6fjul47qZMgYjwQfXP7Nak="
      configs:
        Debug:
          FH_PROJECT_DIR: $(SRCROOT)
    scheme:
      testTargets:
        - FootyHighlightsTests
  FootyHighlightsTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - FootyHighlightsTests
    dependencies:
      - target: FootyHighlights
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Footy Highlights.app/Contents/MacOS/Footy Highlights
        BUNDLE_LOADER: $(TEST_HOST)
